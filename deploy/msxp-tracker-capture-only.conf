# OPT-IN: install after the reviewed roster/production drop-ins as 40-capture-only.conf.
# msxp-tracker remains the sole capture coordinator; restarting it leaves msxp-api running.
[Service]
EnvironmentFile=/etc/msxp/split.env
ExecStartPre=
ExecStart=
ExecStartPre=/opt/msxp/app/.venv/bin/python tools/multi_alpha.py \
    --db-roster ${MSXP_DATABASE} --continuous --capture-only --runtime-state ${MSXP_RUNTIME_STATE} \
    --ocr-python /opt/msxp/app/private/rapidocr/.venv/bin/python \
    --workers 6 --stagger-capture --resident-neural --resident-tesseract \
    $MSXP_CAPTURE_LIMITS --check
ExecStart=/opt/msxp/app/.venv/bin/python tools/multi_alpha.py \
    --db-roster ${MSXP_DATABASE} --continuous --capture-only --runtime-state ${MSXP_RUNTIME_STATE} \
    --ocr-python /opt/msxp/app/private/rapidocr/.venv/bin/python \
    --workers 6 --stagger-capture --resident-neural --resident-tesseract \
    $MSXP_CAPTURE_LIMITS
