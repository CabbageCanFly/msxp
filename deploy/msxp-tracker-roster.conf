# OPT-IN drop-in for msxp-tracker.service; install only after reviewed cutover.
# Not installed by install-ubuntu.sh. See docs/vps-roster-rollout.md.
[Service]
Environment="MSXP_CAPTURE_LIMITS=--stop-after-seconds 600 --exit-after-capture" MSXP_TWITCH_STATUS=
EnvironmentFile=/etc/msxp/roster.env
# A failed or completed bounded trial must stay stopped for operator review.
Restart=no
SuccessExitStatus=130
TimeoutStopSec=180
# Clear the legacy JSON command.
ExecStart=
ExecStartPre=/opt/msxp/app/.venv/bin/python tools/multi_alpha.py \
    --db-roster ${MSXP_DATABASE} --port 8765 --continuous --public-only \
    --cors-origin https://msxp.pages.dev \
    --ocr-python /opt/msxp/app/private/rapidocr/.venv/bin/python \
    --workers 6 --stagger-capture --resident-neural --resident-tesseract \
    $MSXP_TWITCH_STATUS $MSXP_CAPTURE_LIMITS --check
ExecStart=/opt/msxp/app/.venv/bin/python tools/multi_alpha.py \
    --db-roster ${MSXP_DATABASE} --port 8765 --continuous --public-only \
    --cors-origin https://msxp.pages.dev \
    --ocr-python /opt/msxp/app/private/rapidocr/.venv/bin/python \
    --workers 6 --stagger-capture --resident-neural --resident-tesseract \
    $MSXP_TWITCH_STATUS $MSXP_CAPTURE_LIMITS
