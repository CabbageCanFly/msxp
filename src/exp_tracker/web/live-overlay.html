<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EXP Tracker · Stream overlay</title>
<link rel="stylesheet" href="/static/overlay.css"><link rel="stylesheet" href="/static/product.css"><script src="/static/product.js" defer></script></head>
<body class="live-overlay" data-view="overlay"><main id="card" aria-label="Experimental EXP tracker">
<header><span class="charm" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 14.8 9.2 21 12 14.8 14.8 12 21 9.2 14.8 3 12 9.2 9.2Z"/></svg></span><span class="brand">EXP tracker</span><div class="identity"><span id="streamer"></span><span class="separator">·</span><strong id="character">Waiting for EXP</strong></div></header>
<div class="reading"><span id="level">Lv. —</span><div class="progress-section"><progress id="progress" max="100" value="0" aria-label="Observed EXP percentage"></progress><div class="progress-label"><span class="caption">EXP</span><strong id="exp">—</strong><span>[<strong id="percentage">—</strong>]</span></div></div></div>
<div class="statistics"><div class="stat"><span class="stat-label">Recent progress</span><strong id="movement">—</strong></div><div class="stat"><span class="stat-label">Est. EXP / hour</span><strong id="rate">—</strong></div><div class="stat"><span class="stat-label">Pace · pp / hour</span><strong id="pp-rate">—</strong></div><div class="stat"><span class="stat-label">To next level</span><strong id="eta">—</strong></div></div>
<footer><span id="status" role="status">Waiting for EXP</span><time id="age"></time><span class="estimate-mark" title="OCR values and estimates are unverified">Experimental OCR</span></footer>
</main></body></html>
