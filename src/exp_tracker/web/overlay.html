<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapleStory EXP overlay</title>
  <link rel="stylesheet" href="/static/overlay.css">
  <script src="/static/overlay.js" defer></script>
</head>
<body>
  <main id="card" data-state="waiting" aria-label="EXP tracker">
    <header>
      <span class="charm" aria-hidden="true">✦</span>
      <strong id="character">EXP tracker</strong>
      <span id="level">Lv. —</span>
    </header>
    <div class="reading">
      <div class="exp-reading"><span class="caption">EXP</span><strong id="exp">—</strong></div>
      <strong id="percentage">—</strong>
    </div>
    <progress id="progress" max="100" value="0" aria-label="EXP percentage"></progress>
    <div class="session"><span>This session</span><strong id="session-exp">—</strong></div>
    <footer><span id="status" role="status">Waiting for EXP</span><time id="age"></time></footer>
  </main>
</body>
</html>
