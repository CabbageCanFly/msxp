<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapleStory EXP overlay</title>
  <link rel="stylesheet" href="/static/overlay.css">
  <script src="/static/overlay.js" defer></script>
</head>
<body>
  <main id="card" data-state="waiting" aria-label="EXP tracker">
    <header>
      <span class="charm" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3 14.8 9.2 21 12 14.8 14.8 12 21 9.2 14.8 3 12 9.2 9.2Z"/></svg></span>
      <span class="brand">EXP tracker</span>
      <span id="rank" hidden></span>
      <div class="identity"><span id="streamer"></span><span class="separator" aria-hidden="true">·</span><strong id="character">—</strong></div>
    </header>
    <div class="reading">
      <span id="level">Lv. —</span>
      <div class="progress-section">
        <progress id="progress" max="100" value="0" aria-label="EXP percentage"></progress>
        <div class="progress-label"><span class="caption">EXP</span><strong id="exp">—</strong><span>[<strong id="percentage">—</strong>]</span></div>
      </div>
    </div>
    <div class="statistics">
      <div class="stat"><span class="stat-label">Last 5 min</span><strong id="recent-exp">—</strong></div>
      <div class="stat"><span class="stat-label">EXP/h · 30m</span><strong id="pace">—</strong></div>
      <div class="stat"><span class="stat-label">This session</span><strong id="session-exp">—</strong></div>
      <div class="stat"><span class="stat-label">To next level</span><strong id="eta">—</strong></div>
    </div>
    <footer><span id="status" role="status">Waiting for EXP</span><time id="age"></time></footer>
  </main>
</body>
</html>
