<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>msxp overlay · On this device</title>
<link rel="icon" href="/static/steely.png" type="image/png">
<link rel="stylesheet" href="/static/live-overlay.css"><link rel="stylesheet" href="/static/local/popout.css"><script type="module" src="/static/local/popout.js"></script></head>
<body class="live-overlay local-overlay" data-view="overlay" data-layout="card" data-theme="night" data-name="character" data-icon="off" data-job="off" data-bg="dark"><main id="card" aria-label="EXP tracker">
<header><img class="charm" src="/static/steely.png" width="18" height="18" alt=""><span class="brand" id="overlay-brand">msxp.pages.dev</span><div class="identity"><strong id="character">Waiting for EXP</strong><span id="overlay-job"></span></div></header>
<div class="reading"><span id="level">Lv. —</span><div class="progress-section"><progress id="progress" max="100" value="0" aria-label="EXP progress"></progress><div class="progress-label"><span class="caption">EXP</span><strong id="exp">—</strong><span>[<strong id="percentage">—</strong>]</span><span class="general-history-caption" id="general-history-caption">5 min · last hour</span></div><svg id="general-chart" class="mini-history" viewBox="0 0 462 76" preserveAspectRatio="none" role="img" aria-label="EXP history; dashes mean no data"></svg></div></div>
<div class="statistics general-stats"><div class="stat"><span class="stat-label">Last 5 min</span><strong id="movement">—</strong></div><div class="stat"><span class="stat-label" id="rate-label">EXP / hour</span><strong id="rate">—</strong></div><div class="stat"><span class="stat-label">% / hour</span><strong id="pp-rate">—</strong></div><div class="stat"><span class="stat-label">Next level</span><strong id="eta">—</strong></div></div>
<div class="statistics rate-stats" id="rate-stats"><div class="stat"><span class="stat-label">EXP/h · 5 min</span><strong data-rate-window="5">—</strong></div><div class="stat"><span class="stat-label">EXP/h · 15 min</span><strong data-rate-window="15">—</strong></div><div class="stat"><span class="stat-label">EXP/h · 30 min</span><strong data-rate-window="30">—</strong></div><div class="stat"><span class="stat-label">EXP/h · 60 min</span><strong data-rate-window="60">—</strong></div></div>
<div class="hour-chart"><div class="hour-caption"><span id="hour-caption">EXP per 5 min · last hour</span><strong id="hour-total">—</strong></div><svg id="overlay-chart" viewBox="0 0 462 76" preserveAspectRatio="none" role="img" aria-label="EXP gained per 5 minutes over the last hour"></svg></div>
<footer><span id="status" role="status" hidden></span><time id="age"></time></footer>
</main></body></html>
