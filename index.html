<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>msxp</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111418;
      color: #e8edf2;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .wrap {
      text-align: center;
      padding: 24px;
    }

    .mushroom {
      margin: 0 auto 18px;
      image-rendering: pixelated;
      display: block;
    }

    p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #d7dee7;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="mushroom" src="mushroom.gif" alt="Mushroom" />
    <p>a classic tracker is under construction.</p>
  </main>
</body>
</html>
