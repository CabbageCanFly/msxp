[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msclassic-exp-tracker"
version = "0.1.0"
description = "Local HUD OCR and acquisition feasibility tools for MapleStory Classic"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["Pillow>=11,<13", "pytesseract>=0.3.13,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-xdist>=3.8,<4"]
capture = ["streamlink>=8.6.2,<9", "psutil>=7,<8"]

[project.scripts]
msxp = "exp_tracker.msxp:main"
ms-exp = "exp_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exp_tracker = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.png", "web/*.webp", "web/fonts/*", "web/jobs/*.png", "data/*.json"]

[tool.pytest.ini_options]
addopts = "-n 8 --dist=worksteal"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "samples: requires private sample images and the local OCR engine",
    "ocr: requires the local Tesseract engine",
]

